name: PyPI Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI after successful wheel builds"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            exe: whitebox_tools
          - os: windows-2022
            exe: whitebox_tools.exe
          - os: macos-14
            exe: whitebox_tools

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux native dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libproj-dev libsqlite3-dev libtiff-dev pkg-config cmake patchelf

      - name: Install macOS native dependencies
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install proj sqlite libtiff pkg-config cmake
          echo "PKG_CONFIG_PATH=$(brew --prefix proj)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install -y pkgconfiglite
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          if (-not (Test-Path "$vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg $vcpkg
            & "$vcpkg\bootstrap-vcpkg.bat"
          }
          & "$vcpkg\vcpkg.exe" install proj:x64-windows sqlite3:x64-windows tiff:x64-windows curl:x64-windows
          $tripletRoot = "$vcpkg\installed\x64-windows"
          $libDir = "$tripletRoot\lib"
          $manualLibDir = "$libDir\manual-link"
          $includeDir = "$tripletRoot\include"
          if (-not (Test-Path "$libDir\sqlite3.lib")) {
            Write-Host "Expected sqlite3.lib not found in $libDir"
            Get-ChildItem -Path $libDir -Name | Sort-Object | Select-Object -First 200
            throw "sqlite3.lib missing after vcpkg install"
          }
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_TOOLCHAIN_FILE=$vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$libDir;$manualLibDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$includeDir;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTFLAGS=-L native=$libDir -L native=$manualLibDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLITE3_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLITE3_INCLUDE_DIR=$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install build dependencies
        run: python -m pip install --upgrade pip setuptools wheel pytest

      - name: Build whitebox_tools binary
        run: cargo build -p whitebox-tools-app --release

      - name: Stage packaged executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p python/weppcloud_wbt/bin
          cp "target/release/${{ matrix.exe }}" "python/weppcloud_wbt/bin/${{ matrix.exe }}"

      - name: Build platform wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Repair Linux wheel for PyPI compatibility
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade auditwheel
          mkdir -p dist_repaired
          auditwheel repair dist/*.whl -w dist_repaired
          rm -f dist/*.whl
          mv dist_repaired/*.whl dist/

      - name: Verify wheel is platform tagged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          name = wheels[0].name
          assert "none-any" not in name, name
          assert "linux_x86_64" not in name, name
          print(name)
          PY

      - name: Inspect wheel contents for compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          print("Inspecting", wheel.name)
          with zipfile.ZipFile(wheel) as zf:
              names = sorted(zf.namelist())

          relevant = [
              n
              for n in names
              if n.endswith("whitebox_tools.py")
              or "whitebox_tools/__init__.py" in n
              or "weppcloud_wbt/whitebox_tools.py" in n
          ]
          for n in relevant:
              print(n)

          has_compat = any(
              n.endswith("whitebox_tools.py") or "whitebox_tools/__init__.py" in n
              for n in names
          )
          has_ns = any("weppcloud_wbt/whitebox_tools.py" in n for n in names)
          if not has_compat or not has_ns:
              raise SystemExit(
                  "Wheel missing required wrapper files: "
                  f"has_compat={has_compat}, has_ns={has_ns}"
              )
          PY

      - name: Install wheel and run installed-wheel checks
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp dist/*.whl "$temp_dir/"
          cd "$temp_dir"
          python -m pip install --force-reinstall --no-deps ./*.whl
          python -m pip show -f weppcloud-wbt || true
          python - <<'PY'
          import importlib.metadata as md
          import importlib.util
          import site
          import sys

          print("python:", sys.version)
          print("cwd:", __import__("os").getcwd())
          print("site-packages:", site.getsitepackages())
          print("sys.path:")
          for p in sys.path:
            print("  -", p)

          try:
            dist = md.distribution("weppcloud-wbt")
            print("distribution location:", dist.locate_file("."))
            print("top_level.txt:", dist.read_text("top_level.txt"))
            files = [str(f) for f in (dist.files or [])]
            interesting = [
              f for f in files if "whitebox" in f or "weppcloud_wbt" in f
            ]
            print("installed files (filtered):")
            for f in interesting[:200]:
              print("  *", f)
          except Exception as exc:
            print("distribution metadata unavailable:", repr(exc))

          for mod in ("whitebox_tools", "weppcloud_wbt", "weppcloud_wbt.whitebox_tools"):
            spec = importlib.util.find_spec(mod)
            print(f"find_spec({mod!r}) =>", None if spec is None else spec.origin)
          PY
          python - <<'PY'
          from pathlib import Path

          import whitebox_tools
          import weppcloud_wbt.whitebox_tools as ns_mod

          for mod in (whitebox_tools, ns_mod):
              p = Path(mod.__file__).resolve()
              assert any(part in ("site-packages", "dist-packages") for part in p.parts), p
          PY
          python -c "from weppcloud_wbt.whitebox_tools import WhiteboxTools; print(WhiteboxTools().version())"
          python -c "from whitebox_tools import WhiteboxTools; print(WhiteboxTools().version())"
          python - <<'PY'
          import os
          import subprocess
          import sys

          smoke_test = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              "tests",
              "test_ifolp_wrapper_smoke.py",
          )
          raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", "-q", smoke_test]))
          PY
          python - <<'PY'
          from weppcloud_wbt.whitebox_tools import WhiteboxTools

          wbt = WhiteboxTools()
          tools = wbt.list_tools()
          if not isinstance(tools, dict):
              raise SystemExit(f"Unexpected list_tools() result type: {type(tools)}")

          required = {
              "HillslopesTopaz": "hillslopes_topaz",
              "FVSlope": "fv_slope",
              "RaiseRoads": "raise_roads",
              "IterativeFirstOrderLinkPrune": "iterative_first_order_link_prune",
              "RemoveShortStreams": "remove_short_streams",
          }

          key_set = set(tools.keys())
          normalized = {k.replace("_", "").lower(): k for k in key_set}

          print(f"tool_count={len(key_set)}")
          sample = sorted(
              k
              for k in key_set
              if "topaz" in k or "slope" in k or "road" in k or "prune" in k or "stream" in k
          )
          print("relevant_keys:")
          for k in sample[:80]:
              print("  -", k)

          if len(key_set) == 0:
              print("list_tools() returned no parsed keys; falling back to tool_help() checks")
              missing_help = []
              for label in required:
                help_text = str(wbt.tool_help(label))
                if "Error" in help_text or "not recognized" in help_text.lower():
                  missing_help.append(label)
              if missing_help:
                print("Missing required tools (tool_help fallback):")
                for label in missing_help:
                  print(f"  - {label}")
                raise SystemExit(1)
              print("tool_help fallback passed for all required tools")
              raise SystemExit(0)

          missing = []
          for label, snake in required.items():
              token = snake.replace("_", "")
              if token not in normalized:
                  missing.append((label, snake))

          if missing:
              print("Missing required tools:")
              for label, snake in missing:
                  print(f"  - {label} (expected key like '{snake}')")
              raise SystemExit(1)
          PY

      - name: Linux shared dependency inspection
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          ldd "target/release/${{ matrix.exe }}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish To PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || github.event.inputs.publish == 'true'))
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Verify expected wheel set
        shell: bash
        run: |
          set -euo pipefail
          ls -lah dist
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 3, [w.name for w in wheels]
          for wheel in wheels:
              assert "none-any" not in wheel.name, wheel.name
          print("Ready to publish:", [w.name for w in wheels])
          PY

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist