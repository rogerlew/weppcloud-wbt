name: PyPI Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-wheels:
    name: Build Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            exe: whitebox_tools
          - os: windows-2022
            exe: whitebox_tools.exe
          - os: macos-14
            exe: whitebox_tools

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build setuptools wheel pytest

      - name: Build whitebox_tools binary
        run: cargo build -p whitebox-tools-app --release

      - name: Stage packaged executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p python/weppcloud_wbt/bin
          cp "target/release/${{ matrix.exe }}" "python/weppcloud_wbt/bin/${{ matrix.exe }}"

      - name: Build platform wheel
        run: python -m build --wheel

      - name: Verify wheel is platform tagged
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          name = wheels[0].name
          assert "none-any" not in name, name
          print(name)
          PY

      - name: Install wheel and run installed-wheel checks
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          cp dist/*.whl "$temp_dir/"
          cd "$temp_dir"
          python -m pip install --force-reinstall --no-deps ./*.whl
          python - <<'PY'
          from pathlib import Path

          import whitebox_tools
          import weppcloud_wbt.whitebox_tools as ns_mod

          for mod in (whitebox_tools, ns_mod):
              p = Path(mod.__file__).resolve()
              assert any(part in ("site-packages", "dist-packages") for part in p.parts), p
          PY
          python -c "from weppcloud_wbt.whitebox_tools import WhiteboxTools; print(WhiteboxTools().version())"
          python -c "from whitebox_tools import WhiteboxTools; print(WhiteboxTools().version())"
          python - <<'PY'
          import os
          import subprocess
          import sys

          smoke_test = os.path.join(
              os.environ["GITHUB_WORKSPACE"],
              "tests",
              "test_ifolp_wrapper_smoke.py",
          )
          raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", "-q", smoke_test]))
          PY
          python - <<'PY'
          from weppcloud_wbt.whitebox_tools import WhiteboxTools

          wbt = WhiteboxTools()
          tools = wbt.list_tools()
          assert "HillslopesTopaz" in tools
          assert "FVSlope" in tools
          assert "RaiseRoads" in tools
          assert "IterativeFirstOrderLinkPrune" in tools
          assert "RemoveShortStreams" in tools
          PY

      - name: Linux shared dependency inspection
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          ldd "target/release/${{ matrix.exe }}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish To PyPI
    runs-on: ubuntu-latest
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Verify expected wheel set
        shell: bash
        run: |
          set -euo pipefail
          ls -lah dist
          python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 3, [w.name for w in wheels]
          for wheel in wheels:
              assert "none-any" not in wheel.name, wheel.name
          print("Ready to publish:", [w.name for w in wheels])
          PY

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist